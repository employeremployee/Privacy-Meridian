name: Deploy Privacy Meridian

# Builds and deploys the site to GitHub Pages. Runs on every push to the default
# branch, every 30 minutes (to refresh the Privacy Barrelman news feed), and on
# demand. The feed is regenerated fresh at deploy time and shipped with the
# build, so there is no news.json commit churn. If a scheduled feed refresh finds
# nothing, the build step fails and the previous deployment stays live.
#
# One-time setup in the GitHub repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Scheduled runs only fire from the default branch.

on:
  push:
    branches: [v2-map-first]
  schedule:
    # Every 2 hours, which keeps a private repo within the free Actions minutes.
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Project Pages serve from /Privacy-Meridian/. When a custom domain
      # (privacymeridian.org) is added, set this to "/" or remove it.
      VITE_BASE: /Privacy-Meridian/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh the Barrelman news feed
        run: node scripts/barrelman/fetch-news.mjs
        env:
          # Passes the repo secret to the script so non-English titles translate.
          # If the secret is absent, the script falls back to original titles.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Build
        run: npm run build

      - name: Add SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
