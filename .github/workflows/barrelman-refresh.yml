# Builds the site on GitHub's runners and deploys it to Cloudflare Pages
# (project "privacy-meridian", Direct Upload). Runs every 2 hours to refresh
# and translate the news feed, on any push to v2-map-first, and on demand.
# A Cloudflare Worker (docs/launch/refresh-timer) also starts this workflow
# every 2 hours, because GitHub's free scheduler runs late.
#
# Required GitHub repository secrets:
#   DEEPL_API_KEY          - DeepL Free key (title translation)
#   CLOUDFLARE_API_TOKEN   - Cloudflare token with Pages: Edit only
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
#
# Cloudflare Pages serves index.html with a 200 status for app routes like
# /barrelman, so no 404.html copy is needed. Security headers come from
# public/_headers.

name: Refresh and deploy Barrelman

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    branches: [v2-map-first]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # 15, not 10: on 2026-10-22 a slow npm install (7 min) pushed a publish past 10.
    timeout-minutes: 15
    env:
      VITE_BASE: /
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Barrelman build cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: barrelman-cache-${{ github.run_id }}
          restore-keys: |
            barrelman-cache-

      - name: Fetch and translate the feed
        run: node scripts/barrelman/fetch-news.mjs
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=privacy-meridian --branch=main
