name: Refresh and deploy Barrelman

# Builds the site on GitHub's runners and deploys it to GitHub Pages. Everything
# lives in GitHub: no third-party host, no access tokens, no build-minute wall.
# Runs every 2 hours to refresh + translate the news feed, on any push (to
# deploy code changes), and on demand.
#
# Required GitHub repository secret:
#   DEEPL_API_KEY  - DeepL Free key (title translation)
#
# One-time repo setup: make the repo public (free Pages), then
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    branches: [v2-map-first]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Project Pages serve from /Privacy-Meridian/. When a custom domain
      # (privacymeridian.org) is added later, set this to "/" or remove it.
      VITE_BASE: /Privacy-Meridian/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Persist the feed build cache (link resolutions + title translations)
      # across runs, so DeepL only ever translates a given title once. A fresh
      # key each run always saves a new entry; restore-keys picks the latest.
      - name: Restore Barrelman build cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: barrelman-cache-${{ github.run_id }}
          restore-keys: |
            barrelman-cache-

      - name: Fetch and translate the feed
        run: node scripts/barrelman/fetch-news.mjs
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Build
        run: npm run build

      - name: Add SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
