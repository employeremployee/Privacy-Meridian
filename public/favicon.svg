<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Privacy Meridian</title>
  <!-- Compass seen at a tilt (design E2, approved 2026-10-14). -->
  <!-- Body thickness and rim: Selected Blue and Selected Border. -->
  <ellipse cx="16" cy="19" rx="15.5" ry="11.5" fill="#5B9BD5"/>
  <ellipse cx="16" cy="16.5" rx="15.5" ry="11.5" fill="#9DC3E6"/>
  <!-- North notch -->
  <rect x="15.2" y="5.1" width="1.6" height="2.4" fill="#F8F7F4"/>
  <!-- Dial face -->
  <ellipse cx="16" cy="16.5" rx="12.4" ry="9" fill="#F8F7F4"/>
  <!-- Needle shadow on the face (14% Ink), offset down-right -->
  <polygon transform="translate(17.34 17.15) scale(1 0.74)" points="0,-11.5 3.2,0 0,11.5 -3.2,0" fill="#1A1A2E" fill-opacity="0.14"/>
  <!-- Needle raised above the face: red north, grey south, each half beveled -->
  <g transform="translate(16 14.6) scale(1 0.8)">
    <polygon points="0,-11.5 -3.2,0 0,0" fill="#B23A3A"/>
    <polygon points="0,-11.5 3.2,0 0,0" fill="#B23A3A"/>
    <polygon points="0,-11.5 3.2,0 0,0" fill="#1A1A2E" fill-opacity="0.3"/>
    <polygon points="0,11.5 -3.2,0 0,0" fill="#D4D0CC"/>
    <polygon points="0,11.5 3.2,0 0,0" fill="#8A8480"/>
  </g>
  <!-- Pivot -->
  <circle cx="16" cy="14.6" r="1.6" fill="#F8F7F4" stroke="#16213E" stroke-width="0.6"/>
</svg>
