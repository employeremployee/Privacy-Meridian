# Netlify build + hosting config for the static Vite app.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page-app fallback: serve index.html for any path so client-side
# routes (e.g. /regulation/...) don't 404 on refresh or when shared directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
