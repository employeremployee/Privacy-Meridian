name: Refresh Barrelman feed

# Fetches the latest privacy news, translates non-English titles via DeepL, and
# commits public/news.json when it changes. Whatever host builds from this repo
# (Netlify today, a custom host later) then redeploys automatically with the
# fresh, translated feed. Host-independent by design.
#
# One-time GitHub setting required for the commit-back to work:
#   Settings -> Actions -> General -> Workflow permissions -> "Read and write".

on:
  schedule:
    # Every 2 hours (keeps a private repo within free Actions minutes).
    - cron: '0 */2 * * *'
  push:
    branches: [v2-map-first]
    # Only re-run on pushes that change the feed pipeline itself, not every code
    # change (the scheduled run and the host's own build cover the rest).
    paths:
      - 'scripts/barrelman/**'
      - '.github/workflows/barrelman-refresh.yml'
  workflow_dispatch: {}

concurrency:
  group: barrelman-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and translate the feed
        run: node scripts/barrelman/fetch-news.mjs
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore: refresh Barrelman feed"
            git push
          fi
